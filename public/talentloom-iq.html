<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talentloom IQ</title>
<style>
:root{--bg:#ffffff;--ink:#1f1f1e;--muted:#5f5e5a;--card:#f4f3ee;--line:#c9c7bd;--ok:#2f7d32;--okbg:#e5f2e6;--bad:#b3261e;--badbg:#fbe9e7;--accent:#185fa5}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--ink:#ecebe6;--muted:#a8a69d;--card:#262625;--line:#4a4944;--ok:#7bd17f;--okbg:#1f3a21;--bad:#ff8a80;--badbg:#44211f;--accent:#85b7eb}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin:0 0 12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
select,input[type=text],button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--muted)}
.timer{font-size:18px;font-weight:500;color:var(--ink)}
.term{display:inline-block;min-width:44px;text-align:center;padding:8px 10px;margin:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:20px;font-weight:500}
.tq{color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,92px));gap:8px;margin-bottom:14px}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;aspect-ratio:1}
.opts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:600px}
.opt{padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;display:block;width:100%}
.opt:hover{border-color:var(--ink)}
.opt.ok{border:2px solid var(--ok);background:var(--okbg)}
.opt.bad{border:2px solid var(--bad);background:var(--badbg)}
.lab{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.fb{margin-top:12px;font-size:14px;line-height:1.6}
.err{font-size:13px;color:var(--bad);min-height:18px;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
svg{display:block}
.ink{fill:var(--ink)}.bgf{fill:var(--bg)}
.strk{stroke:var(--ink);stroke-width:2}
</style>
</head>
<body>
<div class="wrap">
<h1>Talentloom IQ</h1>
<div class="bar">
  <label>Tyyppi<select id="mode"><option value="mix">Sekoitus</option><option value="num">Numerosarjat</option><option value="nl">Numero- ja kirjainsarjat</option><option value="let">Kirjainsarjat</option><option value="vis">Kuviotäydennykset</option></select></label>
  <label>Vaikeus<select id="level"><option value="1">1 Helppo</option><option value="2" selected>2 Keskitaso</option><option value="3">3 Vaikea</option><option value="0">Sekoitus (1–3)</option></select></label>
  <label>Jatkettavat luvut<select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label>
  <label>Aikaraja<select id="limit"><option value="0">Ei rajaa</option><option value="15">15 s</option><option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option><option value="90">90 s</option></select></label>
  <label>Kokonaisaika<select id="total"><option value="0">Ei rajaa</option><option value="420">7 min</option><option value="600">10 min</option></select></label>
  <button id="newbtn" class="primary" style="align-self:flex-end">Aloita</button>
</div>
<div class="card" id="stage" style="display:none">
  <div class="top"><span id="hdr"></span><span><span class="timer" id="totaltimer" style="margin-right:10px"></span><span class="timer" id="timer"></span> <span id="score" style="margin-left:10px"></span></span></div>
  <div id="body"></div>
  <div class="err" id="err"></div>
  <div class="fb" id="fb"></div>
  <div style="margin-top:12px" id="btns"></div>
</div>
<div class="card">
  <div style="font-weight:500;margin-bottom:8px">Tilastot tyypeittäin</div>
  <div id="stats" class="small">Ei vielä tuloksia.</div>
  <div style="margin-top:10px"><button id="resetstats">Nollaa tilastot</button></div>
</div>
<div class="small">Kaikki tehtävät luodaan selaimessa säännöillä. Mitään ei lähetetä minnekään, ja se toimii ilman verkkoa.</div>
</div>
<script>
/*GEN-START*/
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const diffs=t=>t.slice(1).map((x,i)=>x-t[i]);
const last=a=>a[a.length-1];
const allEq=a=>a.every(x=>x===a[0]);
const sg=n=>n<0?('−'+Math.abs(n)):('+'+n);
const LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function fArith(t){const d=diffs(t);return allEq(d)?last(t)+d[0]:null;}
function fGrow(t){const d=diffs(t);if(d.length<3)return null;const dd=diffs(d);return allEq(dd)?last(t)+last(d)+dd[0]:null;}
function fThird(t){const d=diffs(t);if(d.length<4)return null;const dd=diffs(d);const d3=diffs(dd);if(!allEq(d3))return null;const ndd=last(dd)+d3[0];return last(t)+last(d)+ndd;}
function fGeo(t){const d=diffs(t);if(d.length<3||d[0]===0)return null;const k=d[1]/d[0];if(!Number.isInteger(k)||Math.abs(k)<2)return null;for(let i=0;i<d.length-1;i++)if(d[i+1]!==d[i]*k)return null;return last(t)+last(d)*k;}
function fMulAdd(t){if(t[1]===t[0])return null;const r=(t[2]-t[1])/(t[1]-t[0]);if(!Number.isInteger(r)||r===0||r===1)return null;const c=t[1]-r*t[0];for(let i=0;i<t.length-1;i++)if(t[i+1]!==t[i]*r+c)return null;return last(t)*r+c;}
function fAlt(t,startMul){
  let m,b;
  if(startMul){if(t[0]===0)return null;m=t[1]/t[0];b=t[2]-t[1];}
  else{if(t[1]===0)return null;b=t[1]-t[0];m=t[2]/t[1];}
  if(!Number.isInteger(m)||m===0||m===1)return null;
  const stepAt=i=>((i%2===0)===startMul)?'m':'b';
  for(let i=0;i<t.length-1;i++){const e=stepAt(i)==='m'?t[i]*m:t[i]+b;if(e!==t[i+1])return null;}
  const i=t.length-1;return stepAt(i)==='m'?t[i]*m:t[i]+b;
}
const fAltA=t=>fAlt(t,true),fAltB=t=>fAlt(t,false);
function fInter(t){if(t.length<6)return null;const E=t.filter((_,i)=>i%2===0),O=t.filter((_,i)=>i%2===1);if(E.length<3||O.length<3)return null;const de=diffs(E),dO=diffs(O);if(!allEq(de)||!allEq(dO))return null;return t.length%2===0?last(E)+de[0]:last(O)+dO[0];}
function fFact(t){if(t.length<4||t.some(x=>x===0))return null;const r=[];for(let i=0;i<t.length-1;i++){const q=t[i+1]/t[i];if(!Number.isInteger(q))return null;r.push(q);}for(let i=0;i<r.length-1;i++)if(r[i+1]!==r[i]+1)return null;return last(t)*(last(r)+1);}
function fFib(t){if(t.length<5)return null;const c=t[2]-t[1]-t[0];for(let i=2;i<t.length;i++)if(t[i]!==t[i-1]+t[i-2]+c)return null;return last(t)+t[t.length-2]+c;}
const FITS=[fArith,fGrow,fThird,fGeo,fMulAdd,fAltA,fAltB,fInter,fFact,fFib];

function build(len,a,step){const t=[a];for(let i=1;i<=len;i++)t.push(step(t[i-1],i,t));return t;}
const FAM={
 arith:{label:'Vakioero',fit:fArith,letters:true,
  gen(len){const d=pick([2,3,4,5,6,7,8,9,11,12,-3,-4,-5,-6,-7]);const a=d<0?rnd(40,90):rnd(1,25);return{t:build(len,a,x=>x+d),p:{d}};},
  ex(sh,ans,p){return 'Erot ovat vakio '+sg(p.d)+'. Seuraava: '+last(sh)+' '+sg(p.d).replace('+','+ ').replace('−','− ')+' = '+ans+'.';}},
 grow:{label:'Kasvava ero',fit:fGrow,letters:true,
  gen(len){const dec=Math.random()<0.25;const d0=dec?-rnd(3,7):rnd(1,4);const s=dec?1:rnd(1,3);const a=dec?rnd(70,130):rnd(1,20);return{t:build(len,a,(x,i)=>x+d0+s*(i-1)),p:{d0,s}};},
  ex(sh,ans,p){const d=diffs(sh);const nd=last(d)+p.s;return 'Erot: '+d.map(sg).join(', ')+'. Ne muuttuvat '+sg(p.s)+' joka askeleella, joten seuraava ero on '+sg(nd)+': '+last(sh)+' '+(nd<0?'−':'+')+' '+Math.abs(nd)+' = '+ans+'.';}},
 geo:{label:'Kasvavat erot (×2 tai ×3)',fit:fGeo,letters:true,
  gen(len,lv){const k=lv>=3?pick([2,3]):2;const d0=rnd(1,3);const a=rnd(1,9);return{t:build(len,a,(x,i)=>x+d0*Math.pow(k,i-1)),p:{k,d0}};},
  ex(sh,ans,p){const d=diffs(sh);const nd=last(d)*p.k;return 'Erot: '+d.join(', ')+'. Jokainen ero on '+p.k+' kertaa edellinen, joten seuraava ero on '+nd+': '+last(sh)+' + '+nd+' = '+ans+'.';}},
 mulAdd:{label:'Kerro ja lisää',fit:fMulAdd,
  gen(len){const r=pick([2,3]);const c=pick([-3,-2,-1,0,1,2,3]);const a=rnd(1,6);return{t:build(len,a,x=>x*r+c),p:{r,c}};},
  ex(sh,ans,p){return 'Jokainen termi on edellinen × '+p.r+(p.c?(' '+(p.c<0?'−':'+')+' '+Math.abs(p.c)):'')+'. '+last(sh)+' × '+p.r+(p.c?(' '+(p.c<0?'−':'+')+' '+Math.abs(p.c)):'')+' = '+ans+'.';}},
 altA:{label:'Vuorotteleva ×m ja +b',fit:fAltA,
  gen(len){const m=pick([2,3]);const b=pick([-3,-2,-1,2,3,4]);const a=rnd(2,8);return{t:build(len,a,(x,i)=>(i-1)%2===0?x*m:x+b),p:{m,b,mulFirst:true}};},
  ex(sh,ans,p){const mulNext=(sh.length%2===0)===p.mulFirst;return 'Askeleet vuorottelevat: ×'+p.m+' ja '+sg(p.b)+'. Viimeinen askel oli '+(mulNext?sg(p.b):'×'+p.m)+', joten seuraava on '+(mulNext?'×'+p.m:sg(p.b))+' ja tulos on '+ans+'.';}},
 altB:{label:'Vuorotteleva +b ja ×m',fit:fAltB,
  gen(len){const m=pick([2,3]);const b=pick([-3,-2,-1,2,3,4]);const a=rnd(2,8);return{t:build(len,a,(x,i)=>(i-1)%2===0?x+b:x*m),p:{m,b,mulFirst:false}};},
  ex(sh,ans,p){const mulNext=(sh.length%2===0)===p.mulFirst;return 'Askeleet vuorottelevat: '+sg(p.b)+' ja ×'+p.m+'. Viimeinen askel oli '+(mulNext?sg(p.b):'×'+p.m)+', joten seuraava on '+(mulNext?'×'+p.m:sg(p.b))+' ja tulos on '+ans+'.';}},
 inter:{label:'Lomittuvat sarjat',fit:fInter,len:8,letters:true,
  gen(len){const e0=rnd(1,15),de=pick([1,2,3,4,-1,-2]),o0=rnd(30,90),dO=pick([-2,-3,-4,-5,-6,2,3]);return{t:build(len,e0,(x,i)=>i%2===0?e0+de*(i/2):o0+dO*((i-1)/2)),p:{de,dO}};},
  ex(sh,ans,p){const E=sh.filter((_,i)=>i%2===0),O=sh.filter((_,i)=>i%2===1);return 'Kaksi lomittaista sarjaa. Paikat 1, 3, 5, ...: '+E.join(', ')+' ('+sg(p.de)+'). Paikat 2, 4, 6, ...: '+O.join(', ')+' ('+sg(p.dO)+'). Seuraava kuuluu sarjaan '+(sh.length%2===0?'1':'2')+': '+ans+'.';}},
 fact:{label:'Kertoimet kasvavat (kertoma)',fit:fFact,len:5,
  gen(len){const a=rnd(1,3),r0=rnd(1,3);return{t:build(len,a,(x,i)=>x*(r0+i-1)),p:{r0}};},
  ex(sh,ans,p){const r=[];for(let i=0;i<sh.length-1;i++)r.push(sh[i+1]/sh[i]);const nr=last(r)+1;return 'Kertoimet: '+r.map(x=>'×'+x).join(', ')+'. Ne kasvavat yhdellä, joten seuraava on ×'+nr+': '+last(sh)+' × '+nr+' = '+ans+'.';}},
 fib:{label:'Edellisten summa',fit:fFib,letters:true,
  gen(len){const a=rnd(1,5),b=rnd(1,6),c=pick([0,0,1,-1,2]);const t=[a,b];for(let i=2;i<=len;i++)t.push(t[i-1]+t[i-2]+c);return{t,p:{c}};},
  ex(sh,ans,p){return 'Jokainen termi on kahden edellisen summa'+(p.c?(p.c>0?' plus '+p.c:' miinus '+Math.abs(p.c)):'')+': '+sh[sh.length-2]+' + '+last(sh)+(p.c?(p.c>0?' + '+p.c:' − '+Math.abs(p.c)):'')+' = '+ans+'.';}},
 third:{label:'Erojen erot kasvavat',fit:fThird,letters:true,
  gen(len){const d0=rnd(1,3),dd0=rnd(1,3),a=rnd(0,5);const t=[a];let d=d0,dd=dd0;for(let i=1;i<=len;i++){t.push(t[i-1]+d);d+=dd;dd+=1;}return{t,p:{}};},
  ex(sh,ans,p){const d=diffs(sh),dd=diffs(d);const ndd=last(dd)+1,nd=last(d)+ndd;return 'Erot: '+d.join(', ')+'. Erojen erot: '+dd.join(', ')+', ja ne kasvavat yhdellä. Seuraava erojen ero on '+ndd+', joten seuraava ero on '+nd+': '+last(sh)+' + '+nd+' = '+ans+'.';}}
};
const LPOOLS={1:['arith','grow'],2:['arith','grow','geo','fib'],3:['grow','geo','fib','inter','third']};
const POOLS={1:['arith','grow'],2:['grow','geo','mulAdd','altA','altB','fib'],3:['geo','mulAdd','altA','altB','inter','fact','fib','third','grow']};

function genNum(level,onlyLetters,count){
  count=count||1;
  for(let tries=0;tries<2000;tries++){
    const id=pick(onlyLetters?LPOOLS[level]:POOLS[level]);const f=FAM[id];
    const len=f.len||(level===1?5:6);
    const g=f.gen(len+count-1,level);const t=g.t;
    const shown=t.slice(0,len),answers=t.slice(len,len+count),ans=answers[0];
    if(answers.length<count)continue;
    if(!t.every(x=>Number.isInteger(x)&&Math.abs(x)<=20000))continue;
    if(id!=='fact'&&t.some(x=>Math.abs(x)>1500))continue;
    if(t[0]===t[2]&&t[1]===t[3])continue;
    if(new Set(t).size<t.length-1)continue;
    let unique=true;
    for(let j=0;j<count&&unique;j++){
      const cur=t.slice(0,len+j);
      const preds=FITS.map(fn=>fn(cur)).filter(v=>v!==null);
      if(!preds.length||!preds.every(v=>v===t[len+j])||f.fit(cur)!==t[len+j])unique=false;
    }
    if(!unique)continue;
    const inRange=t.every(x=>x>=1&&x<=26);if(onlyLetters&&!inRange)continue;const letters=onlyLetters||(!!f.letters&&Math.random()<0.25&&inRange);
    const fmt=x=>letters?LET[x-1]:String(x);
    let ex=f.ex(shown,ans,g.p);
    if(letters)ex='Kirjaimet numeroina: '+shown.map(x=>LET[x-1]+'='+x).join(', ')+'. '+ex+' Vastaus '+ans+' = '+LET[ans-1]+'.';
    if(count>1)ex+=' Sama sääntö jatkuu: '+answers.slice(1).map(x=>letters?LET[x-1]+' ('+x+')':String(x)).join(', ')+'.';
    return{kind:'num',fam:(letters?'Kirjainsarja: ':'Numero: ')+f.label,shown:shown.map(fmt),answers:answers.map(fmt),answer:answers.map(fmt).join(', '),count,letters,explain:ex};
  }
  if(level>1)return genNum(level-1,onlyLetters,count);
  if(count>1)return genNum(level,onlyLetters,count-1);
  throw new Error('genNum failed');
}
function genItem(mode,level,count){if(mode==='nl')return genNum(level,Math.random()<0.2,count);if(mode==='let')return genNum(level,true,count);const m=mode==='mix'?pick(['num','vis']):mode;return m==='num'?genNum(level,false,count):genVis(level);}
/*GEN-END*/

function symSvg(sp){
  let g='';
  const defs='<defs><pattern id="hatchP" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--bg)"/><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--ink);stroke-width:1.6"/></pattern><clipPath id="clipS"><rect x="9" y="9" width="62" height="62"/></clipPath></defs>';
  const fillOf=(f,fm)=>f===2?'fill:var(--ink)':f===1?(fm==='h'?'fill:url(#hatchP)':'fill:#B4B2A9'):'fill:var(--bg)';
  const outline='stroke:var(--ink);stroke-width:2';
  const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const reg=(n,cx,cy,r)=>{const a=[];for(let i=0;i<n;i++){const t=(-90+360*i/n)*Math.PI/180;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return a;};
  const star=(cx,cy,r)=>{const a=[];for(let i=0;i<10;i++){const t=(-90+36*i)*Math.PI/180,rr=i%2?r*0.45:r;a.push([cx+rr*Math.cos(t),cy+rr*Math.sin(t)]);}return a;};
  const cross=(cx,cy,r)=>{const w=r*0.38;return [[-w,-r],[w,-r],[w,-w],[r,-w],[r,w],[w,w],[w,r],[-w,r],[-w,w],[-r,w],[-r,-w],[-w,-w]].map(p=>[cx+p[0],cy+p[1]]);};
  const arrow=(cx,cy,r)=>[[0,-r],[r*0.85,0],[r*0.32,0],[r*0.32,r],[-r*0.32,r],[-r*0.32,0],[-r*0.85,0]].map(p=>[cx+p[0],cy+p[1]]);
  const drawShape=(shape,cx,cy,s,f,fm,rot)=>{
    const st=fillOf(f,fm)+';'+outline,r=s/2;
    const tr=rot?' transform="rotate('+rot+' '+cx+' '+cy+')"':'';
    if(shape==='circle')return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="'+st+'"/>';
    if(shape==='square')return '<rect x="'+(cx-r)+'" y="'+(cy-r)+'" width="'+s+'" height="'+s+'" style="'+st+'"/>';
    let p;
    if(shape==='triangle')p=[[cx,cy-r],[cx+r,cy+r],[cx-r,cy+r]];
    else if(shape==='diamond')p=reg(4,cx,cy,r*1.15);
    else if(shape==='pentagon')p=reg(5,cx,cy,r*1.1);
    else if(shape==='hexagon')p=reg(6,cx,cy,r*1.1);
    else if(shape==='star')p=star(cx,cy,r*1.15);
    else if(shape==='cross')p=cross(cx,cy,r*1.05);
    else p=arrow(cx,cy,r*1.05);
    return '<polygon points="'+pts(p)+'" style="'+st+'"'+tr+'/>';
  };
  if(sp.q)g='<text x="40" y="52" text-anchor="middle" style="font-size:34px;fill:var(--muted)">?</text>';
  else if(sp.tile){
    const o=8,S=64,c=32,Q=[[0,0],[c,0],[S,0],[S,c],[S,S],[c,S],[0,S],[0,c]];
    sp.tile.forEach((v,i)=>{
      const p=Q[i],q=Q[(i+1)%8];
      const col=v?'var(--ink)':'var(--bg)';
      g+='<polygon points="'+(o+c)+','+(o+c)+' '+(o+p[0])+','+(o+p[1])+' '+(o+q[0])+','+(o+q[1])+'" style="fill:'+col+';stroke:'+col+';stroke-width:0.6"/>';
    });
    g+='<rect x="'+o+'" y="'+o+'" width="'+S+'" height="'+S+'" style="fill:none;stroke:var(--ink);stroke-width:2"/>';
  }
  else if(sp.dots){const P=[[26,26],[54,26],[26,54],[54,54]];P.forEach((p,i)=>{if(sp.dots.indexOf(i)>=0)g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" style="fill:var(--ink)"/>';});}
  else if(sp.poly){g=drawPoly(sp);}
  else if(sp.lines){
    g='<rect x="9" y="9" width="62" height="62" style="fill:none;stroke:var(--ink);stroke-width:2"/><g clip-path="url(#clipS)"><g transform="translate(40 40) rotate('+sp.ang+')">';
    for(let i=0;i<sp.lines;i++){const off=(i-(sp.lines-1)/2)*15;g+='<line x1="-70" y1="'+off+'" x2="70" y2="'+off+'" style="stroke:var(--ink);stroke-width:3"/>';}
    g+='</g></g>';
  }
  else if(sp.nest){
    g='<rect x="9" y="9" width="62" height="62" style="fill:none;stroke:var(--line);stroke-width:1"/>';
    for(let k=0;k<sp.nest;k++){
      const s=56-k*18,inner=k===sp.nest-1;
      g+=drawShape(sp.sh,40,40,s,inner?sp.fill:0,inner?sp.fm:undefined,0);
    }
  }
  else if(sp.gm){
    g='<rect x="9" y="9" width="62" height="62" style="fill:none;stroke:var(--ink);stroke-width:2"/>';
    for(let i=1;i<3;i++){const p=9+62*i/3;g+='<line x1="'+p+'" y1="9" x2="'+p+'" y2="71" style="stroke:var(--line);stroke-width:1"/><line x1="9" y1="'+p+'" x2="71" y2="'+p+'" style="stroke:var(--line);stroke-width:1"/>';}
    g+='<circle cx="'+(9+62*(sp.gm[0]+0.5)/3)+'" cy="'+(9+62*(sp.gm[1]+0.5)/3)+'" r="6.5" style="fill:var(--ink)"/>';
  }
  else{
    const n=sp.n||1,xs=n===1?[40]:n===2?[26,54]:[18,40,62],s=sp.s||(n===3?16:n===2?22:28);
    xs.forEach(x=>{g+=drawShape(sp.shape,x,40,s,sp.fill,sp.fm,sp.rot);});
  }
  function drawPoly(q){return '<polygon points="'+pts(reg(q.poly,40,40,22))+'" style="'+fillOf(q.fill,q.fm)+';'+outline+'"/>';}
  return '<svg viewBox="0 0 80 80" width="100%" role="img" aria-label="kuvion osa">'+defs+g+'</svg>';
}

const $=id=>document.getElementById(id);
let item=null,done=false,t0=0,tick=null,limit=0,session=[];
let stats={};
try{stats=JSON.parse(localStorage.getItem('kuviotreeni_stats')||'{}');}catch(e){stats={};}
function saveStats(){try{localStorage.setItem('kuviotreeni_stats',JSON.stringify(stats));}catch(e){}}
function showStats(){
  const keys=Object.keys(stats);
  if(!keys.length){$('stats').textContent='Ei vielä tuloksia.';return;}
  keys.sort((a,b)=>stats[a].ok/stats[a].n-stats[b].ok/stats[b].n);
  let h='<table><tr><th>Tyyppi</th><th>Oikein</th><th>Keskiaika</th></tr>';
  keys.forEach(k=>{const s=stats[k];h+='<tr><td>'+k+'</td><td>'+s.ok+'/'+s.n+'</td><td>'+Math.round(s.time/s.n)+' s</td></tr>';});
  $('stats').innerHTML=h+'</table>';
}
function sessionLine(){
  if(!session.length){$('score').textContent='';return;}
  const ok=session.filter(x=>x.ok).length,avg=Math.round(session.reduce((a,x)=>a+x.s,0)/session.length);
  $('score').textContent='Oikein '+ok+'/'+session.length+' · keskim. '+avg+' s';
}
function newItem(){
  clearInterval(tick);
  done=false;limit=+$('limit').value;
  const lv=+$('level').value;
  item=genItem($('mode').value,lv||rnd(1,3),+$('count').value);
  $('stage').style.display='block';$('err').textContent='';$('fb').innerHTML='';$('btns').innerHTML='';
  $('hdr').textContent=(item.kind==='num'?'Sarja':'Kuviotäydennys')+' · tehtävä '+(session.length+1);
  sessionLine();
  if(item.kind==='num'){
    let h='<div style="margin-bottom:14px">';
    item.shown.forEach(s=>{h+='<span class="term">'+s+'</span>';});
    for(let q=0;q<(item.count||1);q++)h+='<span class="term tq">?</span>';h+='</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="ans" placeholder="'+((item.count||1)>1?'Vastauksesi ('+item.count+' lukua)':'Vastauksesi')+'" style="width:'+((item.count||1)>1?230:150)+'px" autocomplete="off"><button id="go" class="primary">Tarkista</button><button id="skip">Ohita</button></div>';
    $('body').innerHTML=h;
    $('ans').addEventListener('input',()=>{$('err').textContent='';});
    $('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkNum();}});
    $('go').onclick=checkNum;$('skip').onclick=()=>finish(false,'ohitettu');
    $('ans').focus();
  }else{
    const cw=item.cols===2?130:92;
    let h='<div class="grid" style="grid-template-columns:repeat('+(item.cols||3)+',minmax(0,'+cw+'px))">';
    item.grid.forEach(sp=>{h+='<div class="cell">'+symSvg(sp)+'</div>';});
    h+='</div><div class="small" style="margin-bottom:8px">Mikä palanen täydentää kuvion?</div><div class="opts">';
    item.options.forEach((sp,k)=>{h+='<div><button class="opt" data-k="'+k+'" aria-label="Vaihtoehto '+'ABCDEF'[k]+'">'+symSvg(sp)+'</button><div class="lab">'+'ABCDEF'[k]+'</div></div>';});
    h+='</div><div style="margin-top:12px"><button id="skip">Ohita</button></div>';
    $('body').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),b=>{b.onclick=()=>pickVis(+b.dataset.k);});
    $('skip').onclick=()=>pickVis(-1);
  }
  t0=Date.now();
  const upd=()=>{
    const e=(Date.now()-t0)/1000;
    if(limit>0){const left=Math.max(0,Math.ceil(limit-e));$('timer').textContent=left+' s';$('timer').style.color=left<=8?'var(--bad)':'var(--ink)';if(e>=limit)timeout();}
    else{$('timer').textContent=Math.round(e)+' s';$('timer').style.color='var(--ink)';}
  };
  upd();tick=setInterval(upd,250);
}
function checkNum(){
  if(done)return;
  const v=$('ans').value.trim();
  if(!v){$('err').textContent='Kirjoita ensin vastaus tai paina Ohita';return;}
  const want=(item.answers||[item.answer]).map(x=>x.toUpperCase());
  let got=v.replace(/−/g,'-').toUpperCase().split(/[\s,;]+/).filter(Boolean);
  if(want.length>1&&got.length===1&&item.letters)got=got[0].split('');
  finish(got.length===want.length&&got.every((x,i)=>x===want[i]),v);
}
function pickVis(k){
  if(done)return;
  finish(k===item.ci,k>=0?'ABCDEF'[k]:'ohitettu',k);
}
function timeout(){if(done)return;finish(false,'aika loppui',-2);}
function finish(ok,given,k){
  if(done)return;done=true;clearInterval(tick);
  const s=Math.min(Math.round((Date.now()-t0)/1000),limit>0?limit:99999);
  session.push({ok:ok,s:s});
  const st=stats[item.fam]||{n:0,ok:0,time:0};st.n++;if(ok)st.ok++;st.time+=s;stats[item.fam]=st;saveStats();
  let head;
  if(item.kind==='num'){
    if($('ans'))$('ans').disabled=true;$('go').disabled=true;$('skip').style.display='none';
    head=ok?'Oikein. ':(given==='ohitettu'?'Ohitettu, ':(given==='aika loppui'?'Aika loppui, ':'Ei aivan, '))+'vastaus on '+item.answer+'. ';
  }else{
    const bs=document.querySelectorAll('.opt');
    bs[item.ci].classList.add('ok');
    if(!ok&&k>=0)bs[k].classList.add('bad');
    $('skip').style.display='none';
    head=ok?'Oikein. ':(given==='ohitettu'?'Ohitettu, ':(given==='aika loppui'?'Aika loppui, ':'Ei aivan, '))+'oikea vastaus on '+'ABCDEF'[item.ci]+'. ';
  }
  $('fb').innerHTML='<b style="font-weight:500">'+head+'</b>'+item.explain+' <span class="small">('+s+' s)</span>';
  sessionLine();showStats();
  $('btns').innerHTML='<button class="primary" id="next">Seuraava</button>';
  $('next').onclick=newItem;$('next').focus();
}
let deadline=0,ttick=null;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function totalUpd(){
  if(!deadline)return;
  const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  $('totaltimer').textContent='Yht. '+fmt(left);$('totaltimer').style.color=left<=60?'var(--bad)':'var(--ink)';
  if(left<=0)endSession();
}
function endSession(){
  clearInterval(ttick);clearInterval(tick);deadline=0;done=true;
  $('body').innerHTML='';$('err').textContent='';$('timer').textContent='';
  $('hdr').textContent='Kokonaisaika täynnä';
  const ok=session.filter(x=>x.ok).length,n=session.length,avg=n?Math.round(session.reduce((a,x)=>a+x.s,0)/n):0;
  $('fb').innerHTML='<b style="font-weight:500">Aika loppui.</b> Vastattuja tehtäviä '+n+', oikein '+ok+'/'+n+(n?', keskim. '+avg+' s':'')+'. Kesken ollutta tehtävää ei lasketa.';
  $('btns').innerHTML='<button class="primary" id="again">Aloita uusi</button>';
  $('again').onclick=()=>$('newbtn').click();$('again').focus();
  showStats();
}
$('newbtn').onclick=()=>{
  session=[];clearInterval(ttick);
  const t=+$('total').value;
  deadline=t>0?Date.now()+t*1000:0;
  $('totaltimer').textContent='';
  if(deadline){ttick=setInterval(totalUpd,250);}
  newItem();totalUpd();
};
$('resetstats').onclick=()=>{stats={};saveStats();showStats();};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&done&&$('next')&&document.activeElement!==$('next')){$('next').click();}});
showStats();
</script>
</body>
