name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  # Lets the job be run against a changed secret or a fixed config without
  # having to invent a migration commit to trigger it.
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ !contains(github.actor, 'lovable') && !contains(github.event.head_commit.author.name, 'lovable') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # SUPABASE_DB_URL must be the *pooler* connection string, because
      # db.<project>.supabase.co resolves to IPv6 only and GitHub runners have no
      # IPv6 route. This job used to convert one to the other at runtime by
      # reading supabase/.temp/pooler-url, which cannot work: that path is
      # gitignored as CLI-managed local state, so it is never present in a
      # checkout. It had been failing on every migration since that file stopped
      # being tracked. The converted value was also never used -- the push step
      # passed the raw secret regardless.
      - name: Validate SUPABASE_DB_URL
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [[ -z "$DB_URL" ]]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$DB_URL" =~ @db\.[a-z0-9-]+\.supabase\.co([:/]|$) ]]; then
            echo "::error::SUPABASE_DB_URL points at db.<project>.supabase.co, which is IPv6-only and unreachable from GitHub runners. Use the pooler connection string instead: Dashboard > Project Settings > Database > Connection string > Session pooler (port 5432)."
            exit 1
          fi

      - name: Deploy migrations to remote
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
