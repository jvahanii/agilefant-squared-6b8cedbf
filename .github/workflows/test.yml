name: Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The edge functions run on Deno, so the app's typecheck cannot see them.
      # Without this, an undefined name ships: it has reached production twice.
      - run: bun run typecheck:functions
      - run: bun run test
